# Deploys to Optimizely Frontend Hosting with opticloud.
#
#   push to master   → Test1 (dev.contentgurus.no)
#   manual run       → any environment; Production (www.contentgurus.no) goes
#                      through the "production" GitHub environment, so its
#                      protection rules (required reviewers) apply.
#
# Secrets (repo settings → Secrets and variables → Actions):
#   OPTI_PROJECT_ID, OPTI_CLIENT_KEY, OPTI_CLIENT_SECRET — from PaaS Portal > API.
#
# The platform runs `npm install` + `npm run build` itself, so this job only
# packages and uploads the source. App settings (NEXT_PUBLIC_SITE_URL etc.)
# live in the PaaS Portal per environment, not here.

name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/lighthouse/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      target:
        description: Frontend Hosting environment
        type: choice
        options: [Test1, Test2, Production]
        default: Test1

# One deployment at a time across ALL environments: the platform refuses to
# start a deployment (HTTP 403 at "Starting deployment") while another one in
# the same project is running, even to a different environment. Runs queue
# instead of cancelling a deployment that's already running. GitHub keeps at
# most one queued run per group, so a newer run replaces an older queued one.
# Local `npm run deploy-*` doesn't see this queue: don't run one while a
# workflow deploy is in progress.
concurrency:
  group: deploy-frontend-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.target || 'Test1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ (github.event.inputs.target || 'Test1') == 'Production' && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # opticloud loads keytar (OS keychain) at startup even when credentials
      # come from OPTI_* variables, and keytar needs libsecret, which the
      # Ubuntu runner image doesn't ship.
      - name: Install libsecret
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-1-0

      - name: Ship
        env:
          OPTI_PROJECT_ID: ${{ secrets.OPTI_PROJECT_ID }}
          OPTI_CLIENT_KEY: ${{ secrets.OPTI_CLIENT_KEY }}
          OPTI_CLIENT_SECRET: ${{ secrets.OPTI_CLIENT_SECRET }}
        run: >
          npx --yes @kunalshetye/opticloud@0.0.6 ship ./
          --type=head
          --prefix=nextjs-fe-hosting
          --target=${{ github.event.inputs.target || 'Test1' }}
          --skip-validation
